set -g mode-keys vi
set -g mouse on
set -g history-limit 10000
set -s escape-time 0
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides "xterm-256color*:Tc"
set-option -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Navigation bindings
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window management
bind-key & kill-window
bind-key x kill-pane
set-option -g renumber-windows on

# Copy-paste bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind P paste-buffer

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Sessionizer
bind-key -r f run-shell "tmux neww ~/.config/scripts/sessionizer"

# Base16 Classic Dark
# Scheme author: Jason Heeris (http://heeris.id.au)
# Template author: Tinted Theming: (https://github.com/tinted-theming)

# default statusbar colors
set-option -g status-style "fg=#d0d0d0,bg=#151515"

# default window title colors
set-window-option -g window-status-style "fg=#d0d0d0,bg=#151515"

# active window title colors
set-window-option -g window-status-current-style "fg=#f4bf75,bg=#151515"

# pane border
set-option -g pane-border-style "fg=#202020"
set-option -g pane-active-border-style "fg=#b0b0b0"

# message text
set-option -g message-style "fg=#e0e0e0,bg=#202020"

# pane number display
set-option -g display-panes-active-colour "#b0b0b0"
set-option -g display-panes-colour "#202020"

# clock
set-window-option -g clock-mode-colour "#6a9fb5"

# copy mode highlight
set-window-option -g mode-style "fg=#f4bf75,bg=#202020"

# bell
set-window-option -g window-status-bell-style "fg=#151515,bg=#ac4142"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#d0d0d0,bg=#151515"

# style for command messages
set-option -g message-command-style "fg=#e0e0e0,bg=#202020"

# Optional active/inactive pane state
set-window-option -g window-active-style "fg=#d0d0d0,bg=default"
set-window-option -g window-style "fg=#d0d0d0,bg=default"

# Optional statusbar
# BASE16_TMUX_OPTION_STATUSBAR is a legacy variable
set-option -g status "on"
set-option -g status-justify "left"
set-option -g status-left "#[fg=#d0d0d0,bg=#303030] #S #[fg=#303030,bg=#151515,nobold,noitalics,nounderscore]"
set-option -g status-left-length "80"
set-option -g status-left-style none
set-option -g status-right "#[fg=#202020,bg=#151515 nobold, nounderscore, noitalics]#[fg=#b0b0b0,bg=#202020] %Y-%m-%d  %H:%M #[fg=#d0d0d0,bg=#202020,nobold,noitalics,nounderscore]#[fg=#151515,bg=#d0d0d0] #h "
set-option -g status-right-length "80"
set-option -g status-right-style none
set-window-option -g window-status-current-format "#[fg=#151515,bg=#f4bf75,nobold,noitalics,nounderscore]#[fg=#202020,bg=#f4bf75] #I #[fg=#202020,bg=#f4bf75,bold] #W#{?window_zoomed_flag,*Z,} #[fg=#f4bf75,bg=#151515,nobold,noitalics,nounderscore]"
set-window-option -g window-status-format "#[fg=#151515,bg=#202020,noitalics]#[fg=#e0e0e0,bg=#202020] #I #[fg=#e0e0e0,bg=#202020] #W#{?window_zoomed_flag,*Z,} #[fg=#202020,bg=#151515,noitalics]"
set-window-option -g window-status-separator ""
