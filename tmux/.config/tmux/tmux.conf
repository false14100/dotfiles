set -g mode-keys vi
set -g mouse on
set -g history-limit 10000
set -s escape-time 0
set -g default-terminal "tmux-256color"
set-option -ga terminal-overrides "xterm-256color*:Tc"
set-option -g focus-events on
set -g allow-passthrough on
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Navigation bindings
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Pane resizing
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window management
bind-key & kill-window
bind-key x kill-pane
set-option -g renumber-windows on

# Copy-paste bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -in -selection clipboard"
bind P paste-buffer

# Don't exit copy mode when dragging with mouse
unbind -T copy-mode-vi MouseDragEnd1Pane

# Reload config
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded"

# Sessionizer
bind-key -r f run-shell "tmux neww ~/.config/scripts/sessionizer"

##### THEME #####

set -g status-position top
set -g status-justify left
set -g status-style "bg=default,fg=#d0d0d0"

set -g status-left-length 80
set -g status-right-length 100

# ─────────────────────────────────────────────
# Status Left
# ─────────────────────────────────────────────

set -g status-left "#[fg=#151515,bg=#f4bf75,bold] 󰆍 #S #[fg=#f4bf75,bg=default] "

# ─────────────────────────────────────────────
# Status Right
# ─────────────────────────────────────────────

set -g status-right "#[fg=#6a9fb5,bg=default]#[fg=#151515,bg=#6a9fb5] 󰥔 %H:%M #[fg=#b0b0b0,bg=#6a9fb5]#[fg=#151515,bg=#b0b0b0] 󰃭 %d %b #[fg=#f4bf75,bg=#b0b0b0]#[fg=#151515,bg=#f4bf75]  #(whoami)@#h "

# ─────────────────────────────────────────────
# Window Styling
# ─────────────────────────────────────────────

setw -g window-status-style "fg=#707880,bg=default"
setw -g window-status-current-style "fg=#d0d0d0,bg=default,bold"

# Inactive windows
setw -g window-status-format " #I:#W "

# Active window
setw -g window-status-current-format "#[fg=#202020,bg=default]#[fg=#f4bf75,bg=#202020,bold] #I:#W#{?window_zoomed_flag, 🔍,} #[fg=#202020,bg=default]"

setw -g window-status-separator ""

# ─────────────────────────────────────────────
# Pane Borders
# ─────────────────────────────────────────────

set -g pane-border-style "fg=#202020"
set -g pane-active-border-style "fg=#b0b0b0"

# ─────────────────────────────────────────────
# Messages
# ─────────────────────────────────────────────

set -g message-style "bg=default,fg=#e0e0e0,bold"
set -g message-command-style "bg=default,fg=#f4bf75"

# ─────────────────────────────────────────────
# Copy Mode
# ─────────────────────────────────────────────

set -g mode-style "bg=default,fg=#f4bf75"

# ─────────────────────────────────────────────
# Clock
# ─────────────────────────────────────────────

setw -g clock-mode-colour "#6a9fb5"

# ─────────────────────────────────────────────
# Pane Numbers
# ─────────────────────────────────────────────

set -g display-panes-active-colour "#b0b0b0"
set -g display-panes-colour "#202020"
